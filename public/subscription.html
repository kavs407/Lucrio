<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assinatura — Lucrio</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/landing.css"><style>main{min-height:85dvh;display:grid;place-items:center;padding:35px 20px}.panel{max-width:500px;width:100%;border:1px solid var(--line);border-radius:16px;padding:32px;background:white}.panel h1{font-size:36px;letter-spacing:-1.8px}.panel p{font-size:14px;color:var(--muted)}.panel label{display:block;font-size:13px}.panel input{width:100%;padding:13px;border:1px solid var(--line);border-radius:6px;margin:9px 0;font-size:16px}.panel button{cursor:pointer;width:100%}.panel a:not(.button){text-decoration:underline}.panel #message{color:var(--ink)}button:disabled{opacity:.6}</style></head><body><main><section class="panel"><a class="brand" href="/">lucrio<span>®</span></a><p class="eyebrow">LUCRIO MENSAL · R$ 19,90</p><h1>Seu próximo passo.</h1><p>Para acessar o sistema, sua conta precisa usar o e-mail de uma compra com pagamento ativo.</p><p id="availability">Estamos finalizando a configuração do checkout. As vendas ainda não estão abertas.</p><a id="checkout" class="button" href="/#plano">Ver o plano ↗</a><p><a href="/ativar">Já comprei · receber meu link</a></p><p><a href="/login">Entrar na minha conta</a></p></section></main><script>fetch("/api/public-config").then(r=>r.json()).then(d=>{if(d.checkoutReady){document.querySelector("#availability").textContent="Assine ou regularize seu pagamento pelo checkout. Após a confirmação, abra o link recebido no seu e-mail.";document.querySelector("#checkout").href="/comprar";document.querySelector("#checkout").textContent="Ir para o checkout ↗"}})</script></body></html>
