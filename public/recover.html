<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucrio — Acesse seu negócio</title><link rel="icon" href="/logo.png"><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f4f8f4;color:#163d30}main{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:100%;max-width:440px;background:white;border:1px solid #e0e9e2;border-radius:24px;padding:32px 26px}.brand{display:flex;align-items:center;gap:8px;font-size:34px;font-weight:800}.brand img{width:48px;height:48px}h1{font-size:30px;letter-spacing:-1px}p{color:#6b8175;line-height:1.6}label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px}input{width:100%;padding:13px;font:16px system-ui;border:1px solid #d6e2d9;border-radius:9px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#009d66;color:white;font-weight:700;font-size:16px;margin-top:24px;cursor:pointer}a{color:#008f5e}#error{color:#9c3f32;font-size:13px;min-height:20px}small{display:block;color:#758779;margin-top:6px;font-size:12px;line-height:1.5}.hidden{display:none}button:disabled{opacity:.6}input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid #b9e8cc;outline-offset:2px}</style></head><body><main><section class="card"><div class="brand"><img src="/logo.png" alt="">lucrio</div><h1>Esqueceu sua senha?</h1><p>Informe o e-mail da sua conta para receber um link de recuperação.</p><form id="recover"><label for="email">E-mail</label><input id="email" type="email" maxlength="254" autocomplete="email" required><p id="message" role="status"></p><button id="submit">Receber link</button></form><p><a href="/login">Voltar para entrar</a></p></section></main><script src="/recover.js"></script></body></html>
